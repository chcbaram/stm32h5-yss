<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .b   { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s   { font-size: 12px; fill: #6b7280; }
    .m   { font-size: 12.5px; fill: #374151; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#fbfbfd"/>

  <text x="20" y="28" class="ttl">stm32h5-yss 아키텍처</text>
  <text x="20" y="48" class="s">파란 상자 = 새로 쓴 H5 타깃 · 점선 = 이 보드에서만 다른 것 · 화살표 = 무엇을 넘겨주는가</text>

  <!-- ===== 왼쪽 계층 ===== -->
  <!-- 앱 -->
  <rect x="20" y="70" width="600" height="68" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="40" y="98" class="b">앱 (src/main.cpp)</text>
  <text x="40" y="122" class="m">thread · trigger · Mutex · Period · Led (src/dev) · usart1 · printf</text>

  <line x1="320" y1="138" x2="320" y2="162" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- yss 커널 -->
  <rect x="20" y="164" width="600" height="68" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="40" y="192" class="b">yss 커널 · API (그대로, CM33 분기만 수정)</text>
  <text x="40" y="216" class="m">scheduler · Mutex · Trigger · Period · Uart / Gpio 기반 클래스</text>

  <line x1="320" y1="232" x2="320" y2="256" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- H5 타깃 -->
  <rect x="20" y="258" width="600" height="68" rx="8" fill="#e8effb" stroke="#2f74d0" stroke-width="2.5"/>
  <text x="40" y="286" class="b">H5 타깃 (새로 작성, lib/yss/src/targets/st)</text>
  <text x="40" y="310" class="m">msp_stm32h5 · Stm32h5Uart · Gpio · Clock · runtime(TIM2)</text>

  <line x1="320" y1="326" x2="320" y2="350" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 벤더 -->
  <rect x="20" y="352" width="600" height="68" rx="8" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="40" y="380" class="b">벤더 패키지 (lib/st, lib/cmsis — 커밋 고정)</text>
  <text x="40" y="404" class="m">STM32 LL · cmsis-device-h5 · CMSIS Core 6 · startup_stm32h563xx.s</text>

  <line x1="320" y1="420" x2="320" y2="444" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 하드웨어 -->
  <rect x="20" y="446" width="600" height="56" rx="8" fill="#eeedeb" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="320" y="479" class="b" text-anchor="middle">STM32H563VIT6 보드 (ST-LINK · USART1 VCP · LED PC13)</text>

  <!-- ===== 오른쪽 보드 층 ===== -->
  <rect x="660" y="164" width="280" height="338" rx="10" fill="none" stroke="#c4c2bf" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="680" y="192" class="b">보드 층 (src/bsp/)</text>

  <text x="680" y="220" class="m">device/config.h</text>
  <text x="680" y="238" class="s">스레드 수 · 타임슬라이스 · USART</text>
  <line x1="660" y1="216" x2="626" y2="216" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="680" y="290" class="m">device/clock.cpp</text>
  <text x="680" y="308" class="s">initializeClock() 덮어쓰기 · 250 MHz</text>
  <line x1="660" y1="292" x2="626" y2="292" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="680" y="372" class="m">ldscript/stm32h5-yss.ld</text>
  <text x="680" y="390" class="s">힙 128 KB · 핸들러 스택 · main 스택</text>
  <line x1="660" y1="386" x2="626" y2="386" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="680" y="440" class="m">bsp.cpp · syscalls.c</text>
  <text x="680" y="458" class="s">initializeYss · 콘솔 · _write · _sbrk</text>
</svg>
