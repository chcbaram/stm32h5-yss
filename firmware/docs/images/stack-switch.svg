<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .b   { font-size: 13px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .m   { font-size: 11.5px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #4b5563; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#fbfbfd"/>

  <text x="20" y="28" class="ttl">SRAM 640 KB 와 두 스택 포인터 — 리셋 직후와 main 진입 시</text>
  <text x="20" y="48" class="s">높이는 비율이 아니다 · 주소는 현재 빌드 (stm32h5-yss.map) · 스레드 스택은 힙에서 new 로 받는다</text>

  <!-- ===== 왼쪽: 리셋 직후 ===== -->
  <text x="40" y="84" class="b" fill="#374151">① 리셋 직후 — ST 스타트업</text>
  <text x="40" y="102" class="s">Reset_Handler: sp = _estack, MSPLIM = _sstack</text>

  <!-- 주소 -->
  <text x="40" y="134" class="m">0x200A_0000</text>
  <text x="40" y="214" class="m">0x2009_F000</text>
  <text x="40" y="324" class="m">0x2002_0CC8</text>
  <text x="40" y="374" class="m">0x2002_04C8</text>
  <text x="40" y="474" class="m">0x2000_04C8</text>
  <text x="40" y="524" class="m">0x2000_0000</text>

  <!-- 막대 -->
  <rect x="140" y="130" width="200" height="80" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="166" class="b" text-anchor="middle" fill="#1e40af">시작 스택 4 KB</text>
  <text x="240" y="184" class="s" text-anchor="middle">MSP 가 쓴다</text>

  <rect x="140" y="210" width="200" height="110" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="240" y="270" class="s" text-anchor="middle">비어 있음 (~505 KB)</text>

  <rect x="140" y="320" width="200" height="50" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="240" y="350" class="s" text-anchor="middle">핸들러 스택 2 KB (안 씀)</text>

  <rect x="140" y="370" width="200" height="100" rx="3" fill="#ecfdf5" stroke="#10b981"/>
  <text x="240" y="424" class="b" text-anchor="middle" fill="#047857">힙 128 KB</text>

  <rect x="140" y="470" width="200" height="50" rx="3" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="240" y="500" class="s" text-anchor="middle">.data · .bss</text>

  <!-- 포인터 -->
  <line x1="410" y1="134" x2="346" y2="134" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="416" y="138" class="m">MSP</text>
  <line x1="410" y1="210" x2="346" y2="210" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="416" y="214" class="m" fill="#b91c1c">MSPLIM</text>
  <text x="352" y="252" class="b" fill="#b91c1c">PSP = 0</text>
  <text x="352" y="270" class="s">이대로 main 에서</text>
  <text x="352" y="286" class="s">PendSV 가 오면 0 아래에</text>
  <text x="352" y="302" class="s">문맥을 써서 버스 폴트</text>

  <!-- 가운데 화살표 -->
  <line x1="486" y1="300" x2="530" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== 오른쪽: main 진입 시 ===== -->
  <text x="540" y="84" class="b" fill="#374151">② main 진입 시 — yss msp 이후</text>
  <text x="540" y="102" class="s">initializeSystem() → switchToProcessStack()</text>

  <rect x="560" y="130" width="200" height="80" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="660" y="166" class="b" text-anchor="middle" fill="#1e40af">main 스레드 스택</text>
  <text x="660" y="184" class="s" text-anchor="middle">같은 자리를 PSP 로</text>

  <rect x="560" y="210" width="200" height="110" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="660" y="270" class="s" text-anchor="middle">비어 있음</text>

  <rect x="560" y="320" width="200" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="660" y="342" class="b" text-anchor="middle" fill="#92400e">핸들러 스택 2 KB</text>
  <text x="660" y="360" class="s" text-anchor="middle">인터럽트 · 예외</text>

  <rect x="560" y="370" width="200" height="100" rx="3" fill="#ecfdf5" stroke="#10b981"/>
  <text x="660" y="398" class="b" text-anchor="middle" fill="#047857">힙 128 KB</text>
  <rect x="580" y="410" width="160" height="22" rx="2" fill="#d1fae5" stroke="#10b981"/>
  <text x="660" y="425" class="s" text-anchor="middle">스레드 스택 (PSP)</text>
  <rect x="580" y="438" width="160" height="22" rx="2" fill="#d1fae5" stroke="#10b981"/>
  <text x="660" y="453" class="s" text-anchor="middle">스레드 스택 (PSP)</text>

  <rect x="560" y="470" width="200" height="50" rx="3" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="660" y="500" class="s" text-anchor="middle">.data · .bss</text>

  <line x1="830" y1="160" x2="766" y2="160" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="836" y="164" class="m">PSP (main)</text>
  <line x1="830" y1="324" x2="766" y2="324" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="836" y="328" class="m">MSP</text>
  <line x1="830" y1="370" x2="766" y2="370" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="836" y="374" class="m" fill="#b91c1c">MSPLIM</text>
  <text x="836" y="430" class="s">PendSV 가</text>
  <text x="836" y="446" class="s">PSP 를 바꾼다</text>
</svg>
